<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hand-written vector PvZ Portable logo, used as the single source for all
  platform icons (raster icons are derived from this file by
  scripts/generate-icons.py).
  "PORTABLE" letter outlines are baked glyph paths from Archivo Black
  (Copyright 2017 The Archivo Black Project Authors, https://github.com/Omnibus-Type/ArchivoBlack),
  licensed under the SIL Open Font License, Version 1.1 (OFL-1.1).
  Source font: google/fonts repo, ofl/archivoblack/ArchivoBlack-Regular.ttf.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="650" height="450">
  <defs>
    <radialGradient id="sunGrad" cx="325" cy="145" r="125" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffff85"/>
      <stop offset="0.45" stop-color="#fff359"/>
      <stop offset="0.75" stop-color="#fddf1a"/>
      <stop offset="1" stop-color="#fecb00"/>
    </radialGradient>
    <linearGradient id="pGrad" x1="0" y1="140" x2="0" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset="0.5" stop-color="#ffc400"/>
      <stop offset="1" stop-color="#e2a400"/>
    </linearGradient>
    <linearGradient id="wGrad" x1="0" y1="150" x2="0" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0ead2"/>
    </linearGradient>
    <linearGradient id="zZomb" x1="0" y1="150" x2="0" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5b08f"/>
      <stop offset="1" stop-color="#6f7d5f"/>
    </linearGradient>
    <linearGradient id="tombGrad" x1="470" y1="140" x2="560" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b9d96"/>
      <stop offset="1" stop-color="#686b66"/>
    </linearGradient>
    <linearGradient id="tombEdgeGrad" x1="460" y1="130" x2="575" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6e716c"/>
      <stop offset="1" stop-color="#464a45"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="175" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6ef4e"/>
      <stop offset="1" stop-color="#a3c41f"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="292" x2="0" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8db64a"/>
      <stop offset="0.45" stop-color="#6f9c3a"/>
      <stop offset="1" stop-color="#4e7a29"/>
    </linearGradient>
  </defs>
  <g transform="translate(10,0)">

  <!-- sun: filled gold disk with broad rays; bases sit inside the disk so no gaps show between rays.
       Drawn before the letters, which occlude everything below their top region. -->
  <path fill="url(#sunGrad)" d="M 257.4,181.6 L 209.7,174.4 L 252.1,151.4 Z M 252.3,160.9 L 173.4,134.4 L 256.5,130.6 Z
    M 253.7,139.7 L 185.2,89.2 L 267.2,112.2 Z M 261.7,120 L 212.1,50.8 L 283,98 Z
    M 275.4,103.7 L 248.6,20.8 L 302.4,89.3 Z M 293.4,92.4 L 296,19.1 L 323.6,87.1 Z
    M 314.1,87.3 L 339.5,16.4 L 344.4,91.5 Z M 335.3,88.7 L 386.6,18.4 L 362.8,102.2 Z
    M 355,96.7 L 422.8,48.5 L 377,118 Z M 371.3,110.4 L 450.7,85.5 L 385.7,137.4 Z
    M 382.6,128.4 L 463.8,129.6 L 387.9,158.6 Z M 387.7,149.1 L 423,169.5 L 383.5,179.4 Z"/>
  <circle cx="320" cy="155" r="85" fill="url(#sunGrad)"/>

  <!-- tombstone -->
  <g transform="rotate(3 517 225)">
    <path fill="url(#tombEdgeGrad)" stroke="#141814" stroke-width="6" stroke-linejoin="round"
      d="M 452,322 L 452,196 Q 452,128 517,128 Q 582,128 582,196 L 582,322 Z"/>
    <path fill="url(#tombGrad)"
      d="M 468,314 L 468,198 Q 468,146 517,146 Q 566,146 566,198 L 566,314 Z"/>
    <path fill="#3b3e3c" d="M 505,172 L 529,172 L 529,200 L 551,200 L 551,222 L 529,222 L 529,268 L 505,268 L 505,222 L 483,222 L 483,200 L 505,200 Z"/>
  </g>

  <!-- small grass tuft growing in FRONT of the tombstone's right foot, tilted clockwise
       ~8 deg to match the ribbon arch tangent at x~592 (slope 2*2.9e-4*(592-325) ~ 8.8 deg) -->
  <g transform="rotate(8 592 322) translate(-12 -10)" stroke-linejoin="round">
    <path fill="url(#leafGrad)" stroke="#1d2b0e" stroke-width="5"
      d="M 578,322 Q 572,304 578,291 Q 588,302 588,318 Z"/>
    <path fill="url(#leafGrad)" stroke="#1d2b0e" stroke-width="5"
      d="M 592,322 Q 594,300 606,293 Q 606,310 600,322 Z"/>
  </g>

  <!-- sprout: single continuous organic silhouette, broad smooth junctions (no necks);
       base sits on the ribbon's top-left edge, which is drawn later and overlaps it.
       Inner details are SOLID fills (no alpha): highlight washes along each leaf's upper
       area, tapered vein lenses flowing into the dark leaf-stem junction strokes. -->
  <g stroke-linejoin="round">
    <path fill="url(#leafGrad)"
      d="M 66,318 C 63,295 64,272 71,252 C 47,256 23,248 12,229 C 3,215 -1,203 2,192 C 28,184 53,192 66,211 C 73,222 78,233 82,243 C 91,212 108,191 130,177 C 141,170 149,166 154,165 C 153,189 143,211 126,226 C 113,237 101,243 91,246 C 95,268 95,294 94,318 Z"/>
    <path fill="#dff263"
      d="M 72,234 C 62,216 46,202 26,195 C 18,192 10,192 8,195 C 12,207 21,217 33,225 C 46,233 60,238 70,239 Z"/>
    <path fill="#dff263"
      d="M 90,234 C 98,212 112,195 130,184 C 138,179 144,175 147,173 C 145,185 138,197 128,206 C 117,216 104,224 93,229 Z"/>
    <!-- tapered veins: slim solid lenses along each leaf centerline, based at the crotch
         so they flow into the junction strokes; narrowing toward the tips -->
    <path fill="#97b523"
      d="M 83.2,241.4 Q 44.8,218.9 18.3,202.6 L 17.7,203.4 Q 43.2,221.1 80.8,244.6 Z"/>
    <path fill="#97b523"
      d="M 86.5,244.4 Q 117.1,212 143.4,183.4 L 142.6,182.6 Q 114.9,210 83.5,241.6 Z"/>
    <!-- silhouette outline on top of all inner details -->
    <path fill="none" stroke="#1d2b0e" stroke-width="6"
      d="M 66,318 C 63,295 64,272 71,252 C 47,256 23,248 12,229 C 3,215 -1,203 2,192 C 28,184 53,192 66,211 C 73,222 78,233 82,243 C 91,212 108,191 130,177 C 141,170 149,166 154,165 C 153,189 143,211 126,226 C 113,237 101,243 91,246 C 95,268 95,294 94,318 Z"/>
  </g>

  <!-- P letter (fanned: tilted counterclockwise on the group arc) -->
  <g transform="rotate(-4.5 185 296)">
    <path fill="url(#pGrad)" fill-rule="evenodd" stroke="#12160d" stroke-width="10" stroke-linejoin="round" paint-order="stroke"
      d="M 163,296 L 167,140 L 228,140 Q 252,142 262,158 Q 270,172 270,192 Q 270,218 258,232 Q 244,246 222,248 L 206,250 L 206,296 Z
         M 202,178 Q 202,172 210,172 L 220,172 Q 232,174 236,184 Q 239,192 239,199 Q 239,214 232,221 Q 226,226 216,226 L 202,226 Z"/>
  </g>

  <!-- v letter (nearly upright, arc center) -->
  <g transform="rotate(-1 317 294)">
    <path fill="url(#wGrad)" stroke="#12160d" stroke-width="10" stroke-linejoin="round" paint-order="stroke"
      d="M 268,192 L 302,192 L 317,244 L 334,192 L 370,192 L 332,294 L 302,294 Z"/>
  </g>

  <!-- Z letter (fanned: slight clockwise tilt; raised 2px to match the original's P/Z relationship) -->
  <g transform="translate(0 -2) rotate(2 408 292)">
    <path fill="url(#zZomb)" stroke="#12160d" stroke-width="10" stroke-linejoin="round" paint-order="stroke"
      d="M 352,152 L 462,152 L 462,188 L 404,254 L 460,254 L 460,292 L 356,292 L 356,256 L 414,190 L 352,190 Z"/>
  </g>

  <!-- ribbon banner: arched upward at center, both edges follow ~2.9e-4 curvature -->
  <path fill="url(#ribbonGrad)" stroke="#12200c" stroke-width="8" stroke-linejoin="round" paint-order="stroke"
    d="M 28,306 L 52,314 Q 325,276 598,314 L 624,306 L 592,412 Q 325,372 56,412 Z"/>
  <path fill="none" stroke="#b9e26a" stroke-width="3" opacity="0.85"
    d="M 42,313 L 63,321 Q 325,287 587,321 L 610,313 L 582,401 Q 325,379 68,401 Z"/>

  <!-- PORTABLE letters (baked Archivo Black outlines, SIL OFL 1.1) -->
  <g fill="#fbfaf0">
    <g transform="translate(108.1,388.1) rotate(-7.5)"><path d="M680 -462V-449Q680 -385 652.0 -333.0Q624 -281 574.0 -251.5Q524 -222 460 -222H295V0H74V-688H460Q524 -688 574.0 -658.5Q624 -629 652.0 -577.5Q680 -526 680 -462ZM295 -383H386Q421 -383 438.5 -401.0Q456 -419 456 -450V-458Q456 -490 438.5 -507.5Q421 -525 386 -525H295Z" transform="scale(0.08430) translate(-377.0,0)"/></g>
    <g transform="translate(170.5,380.6) rotate(-5.6)"><path d="M788 -344Q788 -170 691.0 -79.0Q594 12 416 12Q238 12 141.5 -78.5Q45 -169 45 -344Q45 -519 141.5 -609.5Q238 -700 416 -700Q594 -700 691.0 -609.0Q788 -518 788 -344ZM271 -376V-312Q271 -239 308.0 -196.0Q345 -153 416 -153Q487 -153 524.5 -196.0Q562 -239 562 -312V-376Q562 -449 524.5 -492.0Q487 -535 416 -535Q345 -535 308.0 -492.0Q271 -449 271 -376Z" transform="scale(0.08430) translate(-416.5,0)"/></g>
    <g transform="translate(235.7,375.6) rotate(-3.3)"><path d="M594 -288 747 0H499L377 -251H295V0H74V-688H495Q569 -688 621.5 -659.5Q674 -631 700.5 -582.5Q727 -534 727 -477Q727 -414 693.0 -363.0Q659 -312 594 -288ZM440 -531H295V-404H440Q466 -404 484.0 -422.5Q502 -441 502 -468Q502 -495 484.0 -513.0Q466 -531 440 -531Z" transform="scale(0.08430) translate(-410.5,0)"/></g>
    <g transform="translate(297.8,373.2) rotate(-1.0)"><path d="M470 -512V0H249V-512H23V-688H695V-512Z" transform="scale(0.08430) translate(-359.0,0)"/></g>
    <g transform="translate(363.7,373.5) rotate(1.4)"><path d="M535 0 506 -97H265L236 0H10L261 -688H518L769 0ZM311 -251H460L388 -496H384Z" transform="scale(0.08430) translate(-389.5,0)"/></g>
    <g transform="translate(429.1,376.5) rotate(3.8)"><path d="M722 -519Q722 -392 607 -359V-355Q738 -325 738 -183Q738 -129 711.5 -87.5Q685 -46 639.0 -23.0Q593 0 538 0H74V-688H532Q584 -688 627.5 -666.5Q671 -645 696.5 -606.0Q722 -567 722 -519ZM295 -420H447Q469 -420 483.5 -435.5Q498 -451 498 -474V-484Q498 -506 483.0 -521.5Q468 -537 447 -537H295ZM295 -160H463Q485 -160 499.5 -175.5Q514 -191 514 -214V-224Q514 -247 499.5 -262.5Q485 -278 463 -278H295Z" transform="scale(0.08430) translate(-406.0,0)"/></g>
    <g transform="translate(486.8,381.4) rotate(5.9)"><path d="M74 -688H295V-176H648V0H74Z" transform="scale(0.08430) translate(-361.0,0)"/></g>
    <g transform="translate(541.9,388.1) rotate(7.5)"><path d="M74 -688H669V-523H295V-428H615V-270H295V-165H676V0H74Z" transform="scale(0.08430) translate(-375.0,0)"/></g>
  </g>
  </g>
</svg>
